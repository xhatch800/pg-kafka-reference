name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel an in-progress run when a newer commit is pushed to the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Caches Gradle dependencies and validates the Gradle wrapper jar.
      - uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: build/reports/tests/test/

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # GitHub-hosted Ubuntu runners include Docker, so Testcontainers starts
      # Postgres and Kafka itself. Docker Compose is not used here.
      - name: Run integration tests
        run: ./gradlew integrationTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-report
          path: build/reports/tests/integrationTest/
